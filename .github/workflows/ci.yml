name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Flutter version for the plugin. Validate the
          # library here; the latest-stable job also analyzes the example app.
          - flutter-version: "3.47.x"
            pub-command: "get --no-example"
            analyze-paths: "lib test"
          # Latest stable, which analyzes the plugin and the example app.
          - flutter-version: ""
            pub-command: "get"
            analyze-paths: "."
          # Lowest allowed versions of all dependencies, mirroring the
          # downgrade analysis that pub.dev runs when scoring the package.
          - flutter-version: ""
            pub-command: "downgrade --no-example"
            analyze-paths: "lib test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Flutter Version Info
        run: flutter doctor -v

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub ${{ matrix.pub-command }}

      - name: Lint Code
        run: flutter analyze ${{ matrix.analyze-paths }}

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --set-exit-if-changed .

      - name: Check Apple native ABI header stays in sync
        run: cmp src/ms_zxing.h darwin/mobile_scanner/Sources/MobileScannerNative/include/ms_zxing.h

  unit_tests:
    name: Unit Tests
    needs: [analysis, formatting]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Flutter version for the plugin.
          - name: "flutter-3.47"
            flutter-version: "3.47.x"
            pub-command: "get --no-example"
          # Latest stable Flutter with the newest compatible dependencies.
          - name: "latest"
            flutter-version: ""
            pub-command: "get --no-example"
          # Lowest allowed versions of all dependencies, mirroring the
          # downgrade analysis that pub.dev runs when scoring the package.
          - name: "downgrade"
            flutter-version: ""
            pub-command: "downgrade --no-example"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub ${{ matrix.pub-command }}

      - name: Run Unit Tests with Coverage
        run: flutter test --coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.name }}
          path: coverage/lcov.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittests
          name: codecov-flutter-${{ matrix.name }}
          fail_ci_if_error: true

  build_android:
    name: Build Android
    needs: [analysis, formatting]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        working-directory: example
        run: flutter pub get

      # Also generates example/android/local.properties, which the Gradle
      # build below needs to locate the Flutter SDK.
      - name: Build Example App
        working-directory: example
        run: flutter build apk --release --target-platform android-arm64

      - name: Run Plugin Unit Tests
        working-directory: example/android
        run: ./gradlew :mobile_scanner:testDebugUnitTest

      - name: Upload Unit Test Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-report
          path: example/build/mobile_scanner/reports/tests/

  build_ios:
    name: Build iOS
    needs: [analysis, formatting]
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        swift-package-manager: [true, false]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select Apple dependency manager
        run: |
          if [ "${{ matrix.swift-package-manager }}" = "true" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Install Dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Example App
        working-directory: example
        run: flutter build ios --debug --no-codesign

  build_macos:
    name: Build macOS
    needs: [analysis, formatting]
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        swift-package-manager: [true, false]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select Apple dependency manager
        run: |
          if [ "${{ matrix.swift-package-manager }}" = "true" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - name: Install Dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Example App
        working-directory: example
        run: flutter build macos --debug

  build_web:
    name: Build Web
    needs: [analysis, formatting]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Example App
        working-directory: example
        run: flutter build web

  native_desktop:
    name: Native ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Configure native engine
        run: cmake -S src -B build/native -DMS_ZXING_BUILD_TESTS=ON
      - name: Build native engine and tests
        run: cmake --build build/native --config Release --parallel 2
      - name: Test native bounds and format requests
        run: ctest --test-dir build/native -C Release --output-on-failure
      - uses: subosito/flutter-action@v2
        if: runner.os == 'Linux'
        with:
          channel: stable
          cache: true
      - name: Native Flutter image regression
        if: runner.os == 'Linux'
        env:
          MS_ZXING_NATIVE_TESTS: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/native
        run: |
          flutter pub get
          flutter test test/ffi/zxing_native_test.dart

  browser_regressions:
    name: Browser reader regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --platform chrome test/web/reader_browser_test.dart
